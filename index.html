<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#FAD6E0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Closet">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>Closet</title>
  <script type="importmap">
  { "imports": { "onnxruntime-web": "./onnx/ort.bundle.min.mjs" } }
  </script>
</head>
<body>
  <main class="app-shell">
    <section id="home-screen" class="screen active">
      <header class="top-header">
        <h1>Closet</h1>
        <button id="clearCanvas" class="text-button" type="button">비우기</button>
      </header>
      <div id="canvas" class="canvas">
        <p id="canvasEmpty" class="canvas-empty">아래 옷장 탭에서 옷을 골라<br>여기로 옮겨 조합해보세요</p>
      </div>
    </section>

    <section id="wardrobe-screen" class="screen" hidden>
      <header class="top-header">
        <h1>옷장</h1>
      </header>
      <div id="categoryTabs" class="category-tabs"></div>
      <div id="wardrobeGrid" class="wardrobe-grid"></div>
    </section>
  </main>

  <button id="addButton" class="add-button" type="button" aria-label="옷 추가">+</button>
  <input id="photoInput" type="file" accept="image/*" hidden>

  <nav class="tab-bar" aria-label="주요 메뉴">
    <button class="tab active" data-screen="home" type="button"><span class="tab-icon home-icon" aria-hidden="true"></span><span>홈</span></button>
    <button class="tab" data-screen="wardrobe" type="button"><span class="tab-icon wardrobe-icon" aria-hidden="true"></span><span>옷장</span></button>
  </nav>

  <div id="progressSheet" class="sheet-backdrop" hidden>
    <div class="sheet progress-sheet">
      <p id="progressText" class="progress-text">배경 지우는 중...</p>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <p class="progress-hint">처음 한 번은 AI 엔진을 내려받느라 시간이 좀 걸려요.</p>
    </div>
  </div>

  <div id="categorySheet" class="sheet-backdrop" hidden>
    <div class="sheet">
      <p class="sheet-title">어떤 옷이에요?</p>
      <img id="previewImage" class="preview-image" alt="옷 미리보기">
      <div id="categoryPicker" class="category-picker"></div>
      <div class="sheet-actions">
        <button id="cancelSave" class="secondary-button" type="button">취소</button>
        <button id="confirmSave" class="primary-button" type="button">옷장에 담기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
